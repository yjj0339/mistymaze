<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F2EFE7">
<title>雾光迷宫 · Misty Maze</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23EFE9DE'/%3E%3Cg fill='%232E3338'%3E%3Crect x='6' y='6' width='4' height='14' rx='1'/%3E%3Crect x='6' y='6' width='14' height='4' rx='1'/%3E%3Crect x='16' y='12' width='4' height='14' rx='1'/%3E%3Crect x='22' y='6' width='4' height='9' rx='1'/%3E%3C/g%3E%3Ccircle cx='20' cy='23' r='3' fill='%236FD3B8'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #F2EFE7;
    --wall: #EFE9DE;
    --wall-top: #D9C9B0;
    --floor-a: #F7F3EA;
    --floor-b: #EDE6D8;
    --gold: #FFC94D;
    --mint: #6FD3B8;
    --sky: #CFE7F0;
    --ink: #2E3338;
    --ink-soft: #6B7480;
    --glass: rgba(255, 255, 255, .62);
    --glass-line: rgba(255, 255, 255, .75);
    --shadow: 0 12px 36px rgba(46, 51, 56, .10), 0 1px 0 rgba(255, 255, 255, .9) inset;
    --radius: 20px;
    --ease: cubic-bezier(.22, .8, .28, 1);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #app {
    position: fixed;
    inset: 0;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }

  #scene-canvas { position: absolute; inset: 0; }
  #scene-canvas canvas { display: block; width: 100%; height: 100%; }

  .glass {
    background: var(--glass);
    -webkit-backdrop-filter: blur(18px) saturate(1.6);
    backdrop-filter: blur(18px) saturate(1.6);
    border: 1px solid var(--glass-line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  #hud {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity .35s var(--ease);
    z-index: 10;
  }

  body.ingame #hud { opacity: 1; }

  #top-bar {
    position: absolute;
    top: calc(12px + env(safe-area-inset-top));
    left: calc(14px + env(safe-area-inset-left));
    right: calc(14px + env(safe-area-inset-right));
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: nowrap;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    height: 42px;
    padding: 0 14px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 560;
    letter-spacing: .01em;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    white-space: nowrap;
    flex: 0 0 auto;
  }

  .pill svg { flex: 0 0 auto; opacity: .78; }

  #collect-text { color: var(--ink); }
  #collect-text b { font-weight: 650; }

  @keyframes pill-pop {
    0% { transform: scale(1); }
    38% { transform: scale(1.11); }
    100% { transform: scale(1); }
  }

  #collect-pill.bump { animation: pill-pop .34s var(--ease); }

  #top-actions {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 0 0 auto;
  }

  #top-actions button {
    pointer-events: auto;
    width: 44px;
    height: 44px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
    background: var(--glass);
    -webkit-backdrop-filter: blur(18px) saturate(1.6);
    backdrop-filter: blur(18px) saturate(1.6);
    border: 1px solid var(--glass-line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: transform .18s var(--ease), background .18s var(--ease);
  }

  #top-actions button:hover { transform: translateY(-1px); background: rgba(255, 255, 255, .82); }
  #top-actions button:active { transform: translateY(0) scale(.97); }
  #top-actions button.off { color: rgba(46, 51, 56, .38); }

  #minimap-card {
    position: absolute;
    top: calc(64px + env(safe-area-inset-top));
    right: calc(14px + env(safe-area-inset-right));
    width: 170px;
    height: 170px;
    padding: 10px;
    transition: width .28s var(--ease), height .28s var(--ease), padding .28s var(--ease), border-radius .28s var(--ease), opacity .2s var(--ease);
  }

  #minimap { width: 100%; height: 100%; display: block; border-radius: 12px; background: rgba(255, 255, 255, .52); }

  #minimap-mini { display: none; color: var(--ink-soft); }

  #minimap-card.collapsed {
    width: 44px;
    height: 44px;
    padding: 0;
    border-radius: 999px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    cursor: pointer;
  }

  #minimap-card.collapsed #minimap { display: none; }
  #minimap-card.collapsed #minimap-mini { display: block; }

  #stamina-wrap {
    position: absolute;
    left: 50%;
    bottom: calc(22px + env(safe-area-inset-bottom));
    width: 132px;
    height: 5px;
    margin-left: -66px;
    border-radius: 999px;
    background: rgba(46, 51, 56, .12);
    overflow: hidden;
    opacity: 0;
    transition: opacity .25s var(--ease);
  }

  body.sprinting #stamina-wrap, body.stamina-low #stamina-wrap { opacity: 1; }

  #stamina-fill {
    height: 100%;
    width: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, rgba(111, 211, 184, .95), rgba(255, 201, 77, .95));
    transform-origin: left center;
    transition: transform .08s linear;
  }

  #exit-hint {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 34px;
    height: 34px;
    margin: -17px 0 0 -17px;
    display: none;
    align-items: center;
    justify-content: center;
    color: var(--mint);
    filter: drop-shadow(0 2px 6px rgba(46, 51, 56, .25));
    opacity: .9;
  }

  body.hint-on #exit-hint { display: flex; }

  #joystick-layer, #touch-look-layer {
    position: absolute;
    top: 0;
    height: 100%;
    width: 50%;
    z-index: 6;
    pointer-events: none;
    display: none;
  }

  #joystick-layer { left: 0; }
  #touch-look-layer { right: 0; }

  body.touch #joystick-layer, body.touch #touch-look-layer {
    display: block;
    pointer-events: auto;
  }

  #joystick-base {
    position: absolute;
    width: 124px;
    height: 124px;
    margin: -62px 0 0 -62px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, .8);
    background: rgba(255, 255, 255, .22);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 24px rgba(46, 51, 56, .10);
    opacity: 0;
    transform: scale(.9);
    transition: opacity .16s var(--ease), transform .16s var(--ease);
    pointer-events: none;
  }

  #joystick-base.on { opacity: 1; transform: scale(1); }

  #joystick-knob {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 56px;
    height: 56px;
    margin: -28px 0 0 -28px;
    border-radius: 50%;
    background: rgba(255, 255, 255, .82);
    border: 1px solid rgba(255, 255, 255, .95);
    box-shadow: 0 6px 18px rgba(46, 51, 56, .18);
  }

  #overlay {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
  }

  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity .3s var(--ease), visibility .3s var(--ease);
    background: radial-gradient(120% 90% at 50% 0%, rgba(207, 231, 240, .34), rgba(242, 239, 231, .66) 62%);
    -webkit-backdrop-filter: blur(2px);
    backdrop-filter: blur(2px);
  }

  .screen.active { opacity: 1; visibility: visible; pointer-events: auto; }

  .panel {
    width: min(92vw, 460px);
    max-height: calc(100% - 8px);
    overflow-y: auto;
    padding: 26px 26px 22px;
    transform: translateY(10px) scale(.985);
    opacity: 0;
    transition: transform .3s var(--ease), opacity .3s var(--ease);
  }

  .screen.active .panel { transform: translateY(0) scale(1); opacity: 1; }

  .brand { display: flex; align-items: center; gap: 14px; }

  .brand-mark {
    width: 52px;
    height: 52px;
    flex: 0 0 auto;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
    background: linear-gradient(150deg, rgba(255, 201, 77, .34), rgba(111, 211, 184, .30));
    border: 1px solid rgba(255, 255, 255, .9);
    box-shadow: 0 6px 18px rgba(46, 51, 56, .08);
  }

  h1 {
    margin: 0;
    font-size: 44px;
    line-height: 1.08;
    font-weight: 650;
    letter-spacing: -.02em;
  }

  .subtitle {
    margin: 4px 0 0;
    font-size: 12px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-weight: 560;
  }

  .lede {
    margin: 18px 0 0;
    font-size: 14px;
    line-height: 1.62;
    color: var(--ink-soft);
  }

  .diff-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin: 20px 0 0;
  }

  .diff-card {
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
    min-height: 84px;
    padding: 12px 8px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    border-radius: 16px;
    border: 1px solid rgba(46, 51, 56, .10);
    background: rgba(255, 255, 255, .5);
    color: var(--ink);
    font-family: inherit;
    transition: transform .18s var(--ease), border-color .18s var(--ease), background .18s var(--ease), box-shadow .18s var(--ease);
  }

  .diff-card:hover { transform: translateY(-1px); background: rgba(255, 255, 255, .74); }

  .diff-card[aria-pressed="true"] {
    border-color: rgba(46, 51, 56, .78);
    background: rgba(255, 255, 255, .92);
    box-shadow: 0 8px 20px rgba(46, 51, 56, .10);
  }

  .diff-name { font-size: 15px; font-weight: 620; }
  .diff-meta { font-size: 11px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .diff-tag { font-size: 10px; color: var(--mint); font-weight: 620; letter-spacing: .02em; }
  .diff-tag.hidden { visibility: hidden; }

  .btn {
    appearance: none;
    -webkit-appearance: none;
    font-family: inherit;
    cursor: pointer;
    min-height: 48px;
    padding: 0 20px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .01em;
    transition: transform .18s var(--ease), box-shadow .18s var(--ease), background .18s var(--ease);
  }

  .btn-primary {
    width: 100%;
    margin-top: 18px;
    background: var(--ink);
    color: #fff;
    border: 1px solid var(--ink);
    box-shadow: 0 10px 24px rgba(46, 51, 56, .22);
  }

  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 14px 28px rgba(46, 51, 56, .26); }

  .btn-ghost {
    background: rgba(255, 255, 255, .6);
    color: var(--ink);
    border: 1px solid rgba(46, 51, 56, .12);
  }

  .btn-ghost:hover { transform: translateY(-1px); background: rgba(255, 255, 255, .88); }

  .hint {
    margin: 14px 0 0;
    font-size: 12px;
    line-height: 1.7;
    color: var(--ink-soft);
    text-align: center;
  }

  .hint .kbd {
    display: inline-block;
    padding: 1px 6px;
    margin: 0 1px;
    border-radius: 6px;
    background: rgba(46, 51, 56, .06);
    border: 1px solid rgba(46, 51, 56, .08);
    font-size: 11px;
    font-weight: 600;
    color: var(--ink);
  }

  .touch-hint { display: none; }

  body.touch .desktop-hint { display: none; }
  body.touch .touch-hint { display: block; }

  .win-head { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; }

  .grade-badge {
    position: relative;
    width: 92px;
    height: 92px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .grade-badge svg.star { position: absolute; inset: 0; width: 100%; height: 100%; }

  #win-grade {
    position: relative;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -.02em;
    color: var(--ink);
  }

  .win-title { margin: 2px 0 0; font-size: 22px; font-weight: 650; letter-spacing: -.01em; }
  .win-sub { margin: 0; font-size: 13px; color: var(--ink-soft); }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin: 20px 0 0;
  }

  .stat {
    padding: 12px 8px;
    border-radius: 14px;
    background: rgba(255, 255, 255, .55);
    border: 1px solid rgba(46, 51, 56, .07);
    text-align: center;
  }

  .stat-label { display: block; font-size: 11px; color: var(--ink-soft); letter-spacing: .04em; }
  .stat-value {
    display: block;
    margin-top: 4px;
    font-size: 19px;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
  }

  #win-record {
    margin: 14px 0 0;
    text-align: center;
    font-size: 12px;
    font-weight: 620;
    color: #3FA98C;
    opacity: 0;
    transition: opacity .3s var(--ease);
  }

  #win-record.on { opacity: 1; }

  .btn-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 20px;
  }

  .btn-row .btn-primary { margin-top: 0; width: 100%; }
  .btn-row .wide { grid-column: 1 / -1; }

  .setting {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 14px;
    background: rgba(255, 255, 255, .52);
    border: 1px solid rgba(46, 51, 56, .07);
  }

  .setting-label { font-size: 13px; font-weight: 560; white-space: nowrap; }

  #sens-range {
    flex: 1 1 auto;
    -webkit-appearance: none;
    appearance: none;
    height: 24px;
    border-radius: 999px;
    background-color: transparent;
    background-image: linear-gradient(rgba(46, 51, 56, .16), rgba(46, 51, 56, .16));
    background-size: 100% 4px;
    background-position: center;
    background-repeat: no-repeat;
    outline: none;
    min-height: 24px;
  }

  #sens-range::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #fff;
    border: 1px solid rgba(46, 51, 56, .22);
    box-shadow: 0 2px 8px rgba(46, 51, 56, .18);
    cursor: pointer;
  }

  #sens-range::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #fff;
    border: 1px solid rgba(46, 51, 56, .22);
    cursor: pointer;
  }

  #sens-value { font-size: 12px; color: var(--ink-soft); width: 34px; text-align: right; font-variant-numeric: tabular-nums; }

  .switch {
    margin-left: auto;
    width: 46px;
    height: 28px;
    min-height: 28px;
    padding: 0;
    border-radius: 999px;
    border: 1px solid rgba(46, 51, 56, .12);
    background: rgba(46, 51, 56, .14);
    position: relative;
    cursor: pointer;
    pointer-events: auto;
    transition: background .2s var(--ease);
  }

  .switch::before {
    content: "";
    position: absolute;
    inset: -9px -6px;
    border-radius: 999px;
  }

  .switch::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 2px 6px rgba(46, 51, 56, .2);
    transition: transform .22s var(--ease);
  }

  .switch[aria-pressed="true"] { background: var(--mint); }
  .switch[aria-pressed="true"]::after { transform: translateX(18px); }

  .pause-title { margin: 4px 0 0; font-size: 26px; font-weight: 650; letter-spacing: -.01em; text-align: center; }
  .pause-sub { margin: 6px 0 0; font-size: 13px; color: var(--ink-soft); text-align: center; }

  #btn-resume { width: 100%; margin-top: 20px; }
  #btn-restart, #btn-quit { width: 100%; }

  .btn-row.two { grid-template-columns: 1fr 1fr; }

  .divider { height: 1px; background: rgba(46, 51, 56, .08); margin: 18px 0 2px; }

  .toast {
    position: absolute;
    left: 50%;
    bottom: calc(60px + env(safe-area-inset-bottom));
    transform: translate(-50%, 8px);
    padding: 10px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 560;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s var(--ease), transform .25s var(--ease);
    z-index: 30;
  }

  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  #no-webgl {
    display: none;
    margin-top: 14px;
    padding: 10px 12px;
    border-radius: 12px;
    background: rgba(220, 110, 90, .12);
    color: #A24435;
    font-size: 12px;
    line-height: 1.6;
  }

  @media (max-width: 560px) {
    h1 { font-size: 34px; }
    .panel { width: min(92vw, 420px); padding: 22px 20px 18px; }
    #minimap-card { width: 132px; height: 132px; padding: 8px; top: calc(60px + env(safe-area-inset-top)); }
    #top-actions button { width: 44px; height: 44px; border-radius: 14px; }
    #top-actions #btn-fullscreen { display: none; }
    .pill { height: 42px; padding: 0 12px; font-size: 13px; }
    .diff-card { min-height: 78px; padding: 10px 4px 8px; }
    .diff-name { font-size: 14px; }
    .stat-value { font-size: 17px; }
  }

  @media (max-width: 380px) {
    .pill { padding: 0 10px; font-size: 12.5px; gap: 5px; }
    .pill svg { width: 14px; height: 14px; }
    #top-actions { gap: 6px; }
    #top-actions button { width: 42px; height: 42px; }
    #top-bar { gap: 6px; }
  }

  @media (max-height: 560px) {
    .lede { display: none; }
    .panel { padding: 16px 20px; }
    h1 { font-size: 28px; }
    .diff-row { margin-top: 12px; }
    .diff-card { min-height: 66px; }
    .btn-primary { margin-top: 12px; }
    .hint { margin-top: 8px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: .01ms !important; animation-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="scene-canvas"></div>

  <div id="hud">
    <div id="top-bar">
      <div id="timer-pill" class="pill glass">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg>
        <span id="timer-text">00:00</span>
      </div>
      <div id="collect-pill" class="pill glass">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.6 14.6 9l5.9.8-4.3 4.1 1 5.9L12 17l-5.2 2.8 1-5.9L3.5 9.8 9.4 9Z"/></svg>
        <span id="collect-text"><b>0</b> / 0</span>
      </div>
      <div id="top-actions">
        <button id="btn-map" type="button" aria-label="小地图" aria-pressed="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.5 9 5.5l6 2 5-2v11l-5 2-6-2-5 2z"/><path d="M9 5.5v11M15 7.5v11"/></svg>
        </button>
        <button id="btn-sound" type="button" aria-label="音效" aria-pressed="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3l4-3.5v12l-4-3.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
        </button>
        <button id="btn-pause" type="button" aria-label="暂停">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6v12M15 6v12"/></svg>
        </button>
        <button id="btn-fullscreen" type="button" aria-label="全屏">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H4v5M15 4h5v5M15 20h5v-5M9 20H4v-5"/></svg>
        </button>
      </div>
    </div>

    <div id="minimap-card" class="glass">
      <canvas id="minimap" width="150" height="150"></canvas>
      <div id="minimap-mini">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.5 9 5.5l6 2 5-2v11l-5 2-6-2-5 2z"/><path d="M9 5.5v11M15 7.5v11"/></svg>
      </div>
    </div>

    <div id="stamina-wrap"><div id="stamina-fill"></div></div>

    <div id="exit-hint">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5 18.5 13h-13z"/></svg>
    </div>
  </div>

  <div id="joystick-layer">
    <div id="joystick-base"><div id="joystick-knob"></div></div>
  </div>
  <div id="touch-look-layer"></div>

  <div id="overlay">
    <section id="screen-start" class="screen active">
      <div class="panel glass">
        <div class="brand">
          <div class="brand-mark">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 4.5h15v15h-15z"/><path d="M4.5 9.5h5v5h5v-5h5"/><path d="M9.5 19.5v-5"/></svg>
          </div>
          <div>
            <h1>雾光迷宫</h1>
            <p class="subtitle">Misty Maze</p>
          </div>
        </div>
        <p class="lede">在第一人称低多边形迷宫里穿行，收集散落的雾光碎片，找到薄荷色的出口。雾会记住你走过的地方。</p>

        <div class="diff-row" role="group" aria-label="难度">
          <button class="diff-card" type="button" data-difficulty="easy" aria-pressed="false">
            <span class="diff-name">轻松</span>
            <span class="diff-meta">11 × 11 · 6 枚</span>
            <span class="diff-tag">出口指引</span>
          </button>
          <button class="diff-card" type="button" data-difficulty="normal" aria-pressed="true">
            <span class="diff-name">标准</span>
            <span class="diff-meta">15 × 15 · 10 枚</span>
            <span class="diff-tag hidden">出口指引</span>
          </button>
          <button class="diff-card" type="button" data-difficulty="hard" aria-pressed="false">
            <span class="diff-name">挑战</span>
            <span class="diff-meta">21 × 21 · 16 枚</span>
            <span class="diff-tag hidden">出口指引</span>
          </button>
        </div>

        <button id="btn-start" class="btn btn-primary" type="button">开始探索</button>
        <p class="hint desktop-hint"><span class="kbd">W</span><span class="kbd">A</span><span class="kbd">S</span><span class="kbd">D</span> 移动 · <span class="kbd">Shift</span> 冲刺 · 鼠标转视角 · <span class="kbd">Esc</span> 暂停</p>
        <p class="hint touch-hint">左半屏拖动移动 · 右半屏拖动转视角 · 右上角可暂停</p>
        <div id="no-webgl">当前浏览器未能创建 WebGL 上下文，游戏无法运行。请更换浏览器或开启硬件加速。</div>
      </div>
    </section>

    <section id="screen-win" class="screen">
      <div class="panel glass">
        <div class="win-head">
          <div class="grade-badge">
            <svg class="star" viewBox="0 0 100 100" fill="none" stroke="rgba(46,51,56,.16)" stroke-width="1.5">
              <path d="M50 6 61.8 36.5 94 39.2 69.5 61.1 76.8 92.5 50 75.6 23.2 92.5 30.5 61.1 6 39.2 38.2 36.5Z" fill="rgba(255,201,77,.22)"/>
            </svg>
            <span id="win-grade">S</span>
          </div>
          <h2 class="win-title">你走出了雾</h2>
          <p class="win-sub" id="win-sub">出口的薄荷色光在身后慢慢合拢</p>
        </div>

        <div class="stats">
          <div class="stat"><span class="stat-label">用时</span><span class="stat-value" id="win-time">00:00</span></div>
          <div class="stat"><span class="stat-label">收集</span><span class="stat-value" id="win-collect">0 / 0</span></div>
          <div class="stat"><span class="stat-label">最佳</span><span class="stat-value" id="win-best">--:--</span></div>
        </div>
        <p id="win-record">新纪录</p>

        <div class="btn-row">
          <button id="btn-again" class="btn btn-primary" type="button">再来一局</button>
          <button id="btn-newmaze" class="btn btn-ghost" type="button">换张迷宫</button>
          <button id="btn-menu" class="btn btn-ghost wide" type="button">返回菜单</button>
        </div>
      </div>
    </section>

    <section id="screen-pause" class="screen">
      <div class="panel glass">
        <h2 class="pause-title">暂停</h2>
        <p class="pause-sub">雾在这里停住了</p>
        <button id="btn-resume" class="btn btn-primary" type="button">继续探索</button>
        <div class="btn-row two" style="margin-top:8px">
          <button id="btn-restart" class="btn btn-ghost" type="button">重新开始</button>
          <button id="btn-quit" class="btn btn-ghost" type="button">返回菜单</button>
        </div>
        <div class="divider"></div>
        <div class="setting">
          <span class="setting-label">灵敏度</span>
          <input id="sens-range" type="range" min="0.4" max="2" step="0.05" value="1" aria-label="视角灵敏度">
          <span id="sens-value">1.0</span>
        </div>
        <div class="setting">
          <span class="setting-label">音效</span>
          <button id="sound-toggle" class="switch" type="button" aria-pressed="true" aria-label="音效开关"></button>
        </div>
      </div>
    </section>
  </div>

  <div id="toast" class="toast glass"></div>
</div>

<script src="lib/three.min.js"></script>
<script src="src/core.js"></script>
<script src="src/game.js"></script>
</body>
</html>
